services:
  - type: web
    name: direct-inventory-portal
    env: python
    region: singapore
    plan: standard
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:app --bind 0.0.0.0:$PORT --workers 2 --worker-class gthread --threads 4 --timeout 180 --keep-alive 65
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: ALLOWED_EMAIL_DOMAIN
        value: openhouse.in
      - key: CP_DB_URL
        sync: false
      - key: CP_INVENTORY_TABLE
        value: submissions
      - key: DATABASE_URL
        sync: false
      - key: FORMS_APP_URL
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_ID
        sync: false
      - key: LOG_LEVEL
        value: INFO
      - key: PROPERTIES_DB_URL
        sync: false
      - key: SYNC_TOKEN
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
      - key: INTERNAL_API_KEY
        sync: false
      # Bonvoice calling suite (click-to-call, webhook, dialer API, live calls).
      - key: BONVOICE_BASE_URL
        sync: false
      - key: BONVOICE_TOKEN
        sync: false
      - key: BONVOICE_USERNAME
        sync: false
      - key: BONVOICE_PASSWORD
        sync: false
      - key: BONVOICE_DID
        sync: false
      - key: BONVOICE_CHANNEL_ID
        sync: false
      - key: BONVOICE_WEBHOOK_SECRET
        sync: false

  # All scheduled jobs in ONE cron, every 10 min — scripts/run_all_crons.py runs, in order:
  #   1. supply-sync        mirror cp_inventory_status → inventory.stage (+ Bonvoice call-log pull,
  #                         best-effort, no-ops until the BONVOICE_* vars are set)
  #   2. assign-missing     assign_missing_batch('missing') — only empty assignments, never overwrites
  #   3. backfill-locality  inventory.locality from master_societies (only rows that differ)
  # Each job is isolated so one failing doesn't skip the others; the run exits 1 if any failed.
  #
  # (The auto-dialer tick loop is NOT a cron — it runs as a daemon thread inside the web service
  # above, via start_background_dialer() in wsgi.py. A Postgres advisory lock elects a single ticker
  # across the gunicorn workers. Set DIALER_ENABLED=0 on the web service to turn dialling off.)
  - type: cron
    name: direct-inventory-crons
    env: python
    region: singapore
    rootDir: backend
    schedule: "*/10 * * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python -m scripts.run_all_crons
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DATABASE_URL
        sync: false
      - key: PROPERTIES_DB_URL
        sync: false
      # Bonvoice call-log sync (piggy-backed on supply-sync) — set these in the dashboard.
      - key: BONVOICE_BASE_URL
        sync: false
      - key: BONVOICE_TOKEN
        sync: false
      - key: BONVOICE_USERNAME
        sync: false
      - key: BONVOICE_PASSWORD
        sync: false
      - key: BONVOICE_DID
        sync: false
      - key: BONVOICE_SYNC_LOOKBACK_DAYS
        sync: false
