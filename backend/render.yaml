services:
  - type: web
    name: direct-inventory-portal
    env: python
    region: singapore
    plan: standard
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:app --bind 0.0.0.0:$PORT --workers 2 --worker-class gthread --threads 4 --timeout 180 --keep-alive 65
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: ALLOWED_EMAIL_DOMAIN
        value: openhouse.in
      - key: CP_DB_URL
        sync: false
      - key: CP_INVENTORY_TABLE
        value: submissions
      - key: DATABASE_URL
        sync: false
      - key: FORMS_APP_URL
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_ID
        sync: false
      - key: LOG_LEVEL
        value: INFO
      - key: PROPERTIES_DB_URL
        sync: false
      - key: SYNC_TOKEN
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
      - key: INTERNAL_API_KEY
        sync: false
      # Bonvoice calling suite (click-to-call, webhook, dialer API, live calls).
      - key: BONVOICE_BASE_URL
        sync: false
      - key: BONVOICE_TOKEN
        sync: false
      - key: BONVOICE_USERNAME
        sync: false
      - key: BONVOICE_PASSWORD
        sync: false
      - key: BONVOICE_DID
        sync: false
      - key: BONVOICE_CHANNEL_ID
        sync: false
      - key: BONVOICE_WEBHOOK_SECRET
        sync: false

  # Auto-assign POC for leads that arrived unassigned (bulk-seed etc).
  # mode='missing' → only empty assignments, never overwrites. Every 15 min.
  # Auto-assign POC for leads that arrived unassigned (bulk-seed etc). Every 15 min.
  - type: cron
    name: direct-inventory-assign-missing
    env: python
    region: singapore
    rootDir: backend
    schedule: "*/15 * * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python -m scripts.run_assign_missing
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DATABASE_URL
        sync: false
      - key: PROPERTIES_DB_URL
        sync: false

  # Supply Closure Tracker sync (mirror cp_inventory_status → inventory.stage), and
  # piggy-backs the Bonvoice call-log pull-sync (run_supply_sync.main() runs both).
  # Every 5 min. The Bonvoice step is best-effort and no-ops until the BONVOICE_* vars
  # below are set, so it never affects the supply-sync pass.
  - type: cron
    name: direct-inventory-supply-sync
    env: python
    region: singapore
    rootDir: backend
    schedule: "*/5 * * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python -m scripts.run_supply_sync
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DATABASE_URL
        sync: false
      - key: PROPERTIES_DB_URL
        sync: false
      # Bonvoice call-log sync (piggy-backed) — set these in the dashboard.
      - key: BONVOICE_BASE_URL
        sync: false
      - key: BONVOICE_TOKEN
        sync: false
      - key: BONVOICE_USERNAME
        sync: false
      - key: BONVOICE_PASSWORD
        sync: false
      - key: BONVOICE_DID
        sync: false
      - key: BONVOICE_SYNC_LOOKBACK_DAYS
        sync: false

  # (The Bonvoice call-log pull-sync is NOT a separate cron — it's piggy-backed on the
  # */15 assign-missing cron above. scripts/run_bonvoice_sync.py is still runnable
  # standalone if you ever want to split it back out.)

  # (The auto-dialer tick loop is NOT a separate service — it runs as a daemon thread
  # inside the web service above, via start_background_dialer() in wsgi.py. A Postgres
  # advisory lock elects a single ticker across the gunicorn workers. Set DIALER_ENABLED=0
  # on the web service to turn dialling off.)

  # Backfill inventory.locality from PROPERTIES_DB.master_societies (matches on
  # society name, case/whitespace-insensitive). Daily at 10:00 IST.
  # Render cron schedules are UTC — 10:00 IST = 04:30 UTC (IST is UTC+5:30, and
  # India has no DST, so this holds year-round).
  - type: cron
    name: direct-inventory-backfill-locality
    env: python
    region: singapore
    rootDir: backend
    schedule: "30 4 * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python -m scripts.backfill_locality_from_master
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DATABASE_URL
        sync: false
      - key: PROPERTIES_DB_URL
        sync: false
